# Override exclusivo para validar no CI as imagens já publicadas no GHCR.
# Não defina image/build neste arquivo: compose.production.yaml deve permanecer
# como única fonte dos nomes de imagens da release.
services:
  auditor-fiscal-api:
    ports:
      - "127.0.0.1:18080:8080"

  auditor-fiscal-engine:
    ports:
      - "127.0.0.1:18082:8000"

  auditor-fiscal-caddy:
    profiles: [ci-disabled]

  auditor-fiscal-scheduler:
    profiles: [ci-disabled]

  auditor-fiscal-worker:
    profiles: [ci-disabled]
