name: "${COMPOSE_PROJECT_NAME:-auditor-fiscal}"

x-api-image: &api_image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?Defina IMAGE_NAMESPACE}/auditorfiscal-api:${APP_IMAGE_TAG:-1.1.0}
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILES:-5}"
x-service-env: &service_env
  - path: .env
    # Permite que `compose config --env-file ...` valide o bundle antes de a
    # instalação criar seu .env. No deploy, o Dockge mantém esse arquivo ao
    # lado do compose.yaml e ele é carregado normalmente.
    required: false

services:
  api:
    image: *api_image
    restart: unless-stopped
    env_file: *service_env
    volumes: [api_storage:/var/www/html/storage]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging: *logging

  scheduler:
    image: *api_image
    restart: unless-stopped
    env_file: *service_env
    command: ["php", "artisan", "schedule:work"]
    volumes: [api_storage:/var/www/html/storage]
    depends_on:
      api: {condition: service_healthy}
    logging: *logging

  worker:
    image: *api_image
    restart: unless-stopped
    env_file: *service_env
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=high,default,reports", "--sleep=1", "--tries=3", "--timeout=3600", "--max-time=3600"]
    volumes: [api_storage:/var/www/html/storage]
    depends_on:
      api: {condition: service_healthy}
      fiscal-engine: {condition: service_healthy}
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?Defina IMAGE_NAMESPACE}/auditorfiscal-web:${APP_IMAGE_TAG:-1.1.0}
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:${WEB_INTERNAL_PORT:-80}"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging

  fiscal-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?Defina IMAGE_NAMESPACE}/auditorfiscal-fiscal-engine:${APP_IMAGE_TAG:-1.1.0}
    restart: unless-stopped
    env_file: *service_env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-auditor}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_DATABASE:-auditor_fiscal}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-auditor_fiscal}
      POSTGRES_USER: ${DB_USERNAME:-auditor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-auditor} -d ${DB_DATABASE:-auditor_fiscal}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-auditor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    logging: *logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auditor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    env_file: *service_env
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${AWS_BUCKET}"
        mc anonymous set none "local/$${AWS_BUCKET}"

volumes:
  postgres_data:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_postgres_data"
  redis_data:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_redis_data"
  rabbitmq_data:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_rabbitmq_data"
  minio_data:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_minio_data"
  api_storage:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_api_storage"

networks:
  default:
    name: "${RESOURCE_PREFIX:-auditor-fiscal}_network"
