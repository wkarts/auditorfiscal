version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /services/fiscal-engine
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
