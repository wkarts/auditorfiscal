name: API Base Image

on:
  workflow_call:
    outputs:
      image:
        description: Referência imutável da imagem-base garantida pelo workflow.
        value: ${{ jobs.publish.outputs.image }}
      published:
        description: Indica se a execução precisou publicar uma nova imagem-base.
        value: ${{ jobs.publish.outputs.published }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: api-base-image-${{ github.repository_owner }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auditorfiscal-api-base
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  publish:
    name: Ensure, scan and publish API base
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image: ${{ steps.image.outputs.image }}
      published: ${{ steps.result.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load immutable version contract
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source docker/base/versions.env
          [[ "$API_BASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]+$ ]]
          [[ "$PHP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]
          [[ "$COMPOSER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NAMESPACE="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${API_BASE_VERSION}"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'php=%s\n' "$PHP_VERSION" >> "$GITHUB_OUTPUT"
          printf 'composer=%s\n' "$COMPOSER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$API_BASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'namespace=%s\n' "$NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable base availability
        id: availability
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.image }}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Imagem-base já publicada; reconstrução dispensada.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Imagem-base ainda não publicada; será construída uma única vez.'
          fi

      - name: Build and load AMD64 candidate for scan
        if: steps.availability.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/api.Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          tags: auditorfiscal-api-base:scan
          build-args: |
            PHP_VERSION=${{ steps.image.outputs.php }}
            COMPOSER_VERSION=${{ steps.image.outputs.composer }}
          cache-from: type=gha,scope=api-base
          cache-to: type=gha,mode=min,scope=api-base

      - name: Scan candidate
        if: steps.availability.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auditorfiscal-api-base:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publish scanned immutable AMD64 image
        id: push
        if: steps.availability.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/api.Dockerfile
          platforms: linux/amd64
          push: true
          pull: false
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/${{ steps.image.outputs.namespace }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            PHP_VERSION=${{ steps.image.outputs.php }}
            COMPOSER_VERSION=${{ steps.image.outputs.composer }}
          cache-from: type=gha,scope=api-base
          cache-to: type=gha,mode=min,scope=api-base
          provenance: mode=max
          sbom: true

      - name: Attest image
        if: steps.availability.outputs.exists != 'true'
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.namespace }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.availability.outputs.exists }}' == 'true' ]]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo "Imagem-base reutilizada: ${{ steps.image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo "Imagem-base publicada: ${{ steps.image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          fi
