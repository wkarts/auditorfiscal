name: API Base Image

on:
  push:
    branches: [main]
    paths:
      - docker/base/api.Dockerfile
      - docker/base/versions.env
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: api-base-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auditorfiscal-api-base
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  publish:
    name: Build, scan and publish API base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load immutable version contract
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source docker/base/versions.env
          [[ "$API_BASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]+$ ]]
          echo "tag=$API_BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "php=$PHP_VERSION" >> "$GITHUB_OUTPUT"
          echo "composer=$COMPOSER_VERSION" >> "$GITHUB_OUTPUT"
          echo "namespace=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load AMD64 candidate for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/api.Dockerfile
          platforms: linux/amd64
          load: true
          tags: auditorfiscal-api-base:scan
          build-args: |
            PHP_VERSION=${{ steps.version.outputs.php }}
            COMPOSER_VERSION=${{ steps.version.outputs.composer }}
          cache-from: type=gha,scope=api-base
          cache-to: type=gha,mode=max,scope=api-base

      - name: Refuse to overwrite immutable version tag
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ steps.version.outputs.namespace }}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "A tag imutável já existe: $IMAGE. Incremente API_BASE_VERSION." >&2
            exit 1
          fi

      - name: Scan candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auditorfiscal-api-base:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publish immutable multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.namespace }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.namespace }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            PHP_VERSION=${{ steps.version.outputs.php }}
            COMPOSER_VERSION=${{ steps.version.outputs.composer }}
          cache-from: type=gha,scope=api-base
          cache-to: type=gha,mode=max,scope=api-base
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.version.outputs.namespace }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
