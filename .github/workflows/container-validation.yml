name: Container Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  COMPOSE_FILE: compose.yaml:deploy/ci/compose.ci.yaml

jobs:
  amd64:
    name: Build, integrate and scan images (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          TEST_PASSWORD="$(openssl rand -hex 24)"
          TEST_APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::${TEST_PASSWORD}"
          echo "TEST_PASSWORD=${TEST_PASSWORD}" >> "$GITHUB_ENV"
          cat > .env <<ENV
          APP_NAME="Auditor Fiscal IBS/CBS — WWSoftware's"
          APP_ENV=testing
          APP_KEY=${TEST_APP_KEY}
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:18081
          APP_TIMEZONE=UTC
          FRONTEND_URL=http://127.0.0.1:18081
          ADMIN_EMAIL=wkarts@gmail.com
          ADMIN_PASSWORD=${TEST_PASSWORD}
          DEPLOY_MODE=source
          GHCR_REGISTRY=ghcr.io
          GHCR_NAMESPACE=wkarts
          AUDITOR_IMAGE_TAG=pr
          LOCAL_API_IMAGE=auditor-fiscal/api:pr
          WEB_BIND_HOST=127.0.0.1
          WEB_PUBLISHED_PORT=18081
          AUDITOR_DOMAIN=auditor.wwsoftwares.com.br
          DB_CONNECTION=pgsql
          DB_HOST=auditor-fiscal-postgres
          DB_PORT=5432
          DB_DATABASE=auditor_fiscal
          DB_USERNAME=auditor
          DB_PASSWORD=${TEST_PASSWORD}@
          REDIS_HOST=auditor-fiscal-redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${TEST_PASSWORD}
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=rabbitmq
          RABBITMQ_HOST=auditor-fiscal-rabbitmq
          RABBITMQ_PORT=5672
          RABBITMQ_USER=auditor
          RABBITMQ_PASSWORD=${TEST_PASSWORD}
          RABBITMQ_VHOST=/
          FILESYSTEM_DISK=s3
          AWS_ACCESS_KEY_ID=auditor
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=auditor-fiscal-ci
          AWS_ENDPOINT=http://auditor-fiscal-minio:9000
          AWS_USE_PATH_STYLE_ENDPOINT=true
          FISCAL_ENGINE_URL=http://auditor-fiscal-engine:8000
          FISCAL_ENGINE_TOKEN=${TEST_PASSWORD}
          MAX_UPLOAD_MB=50
          ZIP_MAX_FILES=1000
          ZIP_MAX_UNCOMPRESSED_MB=256
          MINIO_ROOT_USER=auditor
          MINIO_ROOT_PASSWORD=${TEST_PASSWORD}
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${TEST_PASSWORD}
          ENV
          chmod 600 .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate resolved Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --format json | python3 -c '
          import json, sys

          expected = "auditor-fiscal/api:pr"
          services = json.load(sys.stdin)["services"]
          api_services = (
              "auditor-fiscal-app-init",
              "auditor-fiscal-api",
              "auditor-fiscal-scheduler",
              "auditor-fiscal-worker",
          )
          invalid = {
              service: services[service].get("image")
              for service in api_services
              if services[service].get("image") != expected
          }
          if invalid:
              details = ", ".join(f"{service}={image!r}" for service, image in invalid.items())
              raise SystemExit(f"Serviços derivados da API devem usar {expected}: {details}")
          print(f"Imagem uniforme confirmada em {len(api_services)} serviços: {expected}")
          '

      - name: Build reusable API base with GHA cache
        run: |
          docker buildx build \
            --file docker/base/api.Dockerfile \
            --tag ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v2 \
            --cache-from type=gha,scope=pr-api-base \
            --cache-to type=gha,mode=max,scope=pr-api-base \
            --load .

      - name: Select Docker image-store builder for dependent builds
        shell: bash
        run: |
          set -euo pipefail
          # setup-buildx seleciona um builder docker-container. Embora --load
          # exporte a base para o image store do daemon, esse builder isolado
          # tentaria resolver o FROM novamente no GHCR. O driver docker reutiliza
          # a imagem local carregada e mantém a PR independente do package remoto.
          docker image inspect ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v2 >/dev/null
          docker buildx use default
          docker buildx inspect default | grep -Eq '^Driver:[[:space:]]+docker$'

      - name: Build all application images
        run: docker compose build --parallel auditor-fiscal-api auditor-fiscal-web auditor-fiscal-engine

      - name: Start infrastructure
        run: docker compose up -d --wait --wait-timeout 180 auditor-fiscal-postgres auditor-fiscal-redis auditor-fiscal-rabbitmq auditor-fiscal-minio

      - name: Prepare API bind mount permissions
        run: |
          docker compose run --rm --no-deps auditor-fiscal-storage-init
          docker compose run --rm --no-deps --entrypoint /bin/sh auditor-fiscal-api -ec 'test -w /var/www/html/storage'
          docker compose run --rm --no-deps -e APP_KEY= --entrypoint /bin/sh auditor-fiscal-api -ec '/usr/local/bin/entrypoint /bin/true; test -s /var/www/html/storage/.app_key'

      - name: Initialize object storage
        run: docker compose run --rm --no-deps auditor-fiscal-minio-init

      - name: Initialize database, administrator and RabbitMQ queues
        run: |
          docker compose run --rm --no-deps auditor-fiscal-app-init
          for queue in high default reports; do
            docker compose exec -T auditor-fiscal-rabbitmq rabbitmqctl list_queues --quiet name \
              | grep -Fx "$queue"
          done

      - name: Start application services
        run: docker compose up -d auditor-fiscal-api auditor-fiscal-web auditor-fiscal-engine auditor-fiscal-scheduler auditor-fiscal-worker

      - name: Wait for application health endpoints
        shell: bash
        run: |
          set -euo pipefail
          wait_url() {
            local name="$1" url="$2"
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$name disponível em $url"
                return 0
              fi
              sleep 2
            done
            echo "Timeout aguardando $name em $url" >&2
            return 1
          }
          wait_url API-live http://127.0.0.1:18080/api/v1/health/live
          wait_url API-ready http://127.0.0.1:18080/api/v1/health/ready
          wait_url Web http://127.0.0.1:18081/health
          wait_url Fiscal-engine http://127.0.0.1:18082/health/ready

      - name: Validate stable and idempotent deployment
        shell: bash
        run: |
          set -euo pipefail
          permanent_services=(
            auditor-fiscal-api auditor-fiscal-web auditor-fiscal-engine
            auditor-fiscal-scheduler auditor-fiscal-worker
            auditor-fiscal-postgres auditor-fiscal-redis
            auditor-fiscal-rabbitmq auditor-fiscal-minio
          )
          docker compose up -d "${permanent_services[@]}"

          # O segundo `up` pode recriar scheduler/worker enquanto os serviços
          # one-shot são reavaliados. Aguarda três leituras consecutivas estáveis
          # para não confundir essa transição válida com um restart loop.
          compose_services_by_status() {
            local status="$1"

            docker compose ps --status "$status" --services \
              | sed '/^[[:space:]]*$/d'
          }

          print_stability_state() {
            printf 'stable_checks=%d running_services=%d restarting_services=%d missing_services=%d\n' \
              "$stable_checks" "${#running_services[@]}" "${#restarting_services[@]}" "${#missing_services[@]}"
            printf 'running_services:'
            (( ${#running_services[@]} == 0 )) || printf ' %q' "${running_services[@]}"
            printf '\nmissing_services:'
            (( ${#missing_services[@]} == 0 )) || printf ' %q' "${missing_services[@]}"
            printf '\nrestarting_services:'
            (( ${#restarting_services[@]} == 0 )) || printf ' %q' "${restarting_services[@]}"
            printf '\n'
          }

          stable_checks=0
          stabilization_timeout=60
          stabilization_deadline=$((SECONDS + stabilization_timeout))
          previous_state=''
          while (( SECONDS < stabilization_deadline )); do
            mapfile -t running_services < <(compose_services_by_status running)
            mapfile -t restarting_services < <(compose_services_by_status restarting)
            missing_services=()
            for service in "${permanent_services[@]}"; do
              if ! printf '%s\n' "${running_services[@]}" | grep -Fxq "$service"; then
                missing_services+=("$service")
              fi
            done

            if (( ${#missing_services[@]} == 0 && ${#restarting_services[@]} == 0 )); then
              stable_checks=$((stable_checks + 1))
            else
              stable_checks=0
            fi

            current_state="${stable_checks}|${running_services[*]}|${restarting_services[*]}|${missing_services[*]}"
            if [[ "$current_state" != "$previous_state" ]]; then
              print_stability_state
              previous_state="$current_state"
            fi

            if (( stable_checks >= 3 )); then
              break
            fi

            sleep 2
          done

          if (( stable_checks < 3 )); then
            printf 'A stack não permaneceu estável por três leituras em %ss.\n' "$stabilization_timeout" >&2
            printf 'Serviços ausentes após estabilização: %s\n' "${missing_services[*]:-nenhum}" >&2
            printf 'Serviços reiniciando: %s\n' "${restarting_services[*]:-nenhum}" >&2
            print_stability_state >&2
            docker compose ps --all >&2
            exit 1
          fi

          printf 'Stack estável: missing_services=%d restarting_services=%d stable_checks=%d\n' \
            "${#missing_services[@]}" "${#restarting_services[@]}" "$stable_checks"

          for service in "${permanent_services[@]}"; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_id")"
            if (( restart_count != 0 )); then
              echo "$service reiniciou $restart_count vez(es) durante o deploy." >&2
              docker compose logs --no-color --tail=100 "$service" >&2
              exit 1
            fi
          done

          docker compose logs --no-color --tail=200 > /tmp/auditor-fiscal-compose.log
          if grep -E 'not a directory|restart loop|no queue .*(high|default|reports)' /tmp/auditor-fiscal-compose.log; then
            echo 'Os logs contêm erro operacional bloqueante.' >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18081/health >/dev/null \
            || { echo 'Frontend indisponível após estabilização.' >&2; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:18081/api/v1/health/live >/dev/null \
            || { echo 'API indisponível pelo proxy interno após estabilização.' >&2; exit 1; }

      - name: Run authenticated API smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_PAYLOAD="$(python3 -c 'import json,os; print(json.dumps({"email":"wkarts@gmail.com","password":os.environ["TEST_PASSWORD"],"device_name":"ci"}))')"
          if ! LOGIN_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "$LOGIN_PAYLOAD" \
            http://127.0.0.1:18080/api/v1/auth/login)"; then
            echo 'Falha no login do smoke test:' >&2
            printf '%s\n' "$LOGIN_RESPONSE" >&2
            exit 1
          fi
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$LOGIN_RESPONSE")"
          test -n "$TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:18080/api/v1/catalogs \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["data"]) >= 1'

          COMPANY_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:18080/api/v1/companies?per_page=1' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"][0]["id"])')"
          CATALOG_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:18080/api/v1/catalogs \
            | python3 -c 'import json,sys; print(next(item["id"] for item in json.load(sys.stdin)["data"] if item["status"] == "published"))')"
          ANALYSIS_ID="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -F "company_id=$COMPANY_ID" \
            -F "catalog_version_id=$CATALOG_ID" \
            -F 'name=Validação Auditor Fiscal' \
            -F 'files[]=@examples/xml/NFe-demo-saida.xml;type=application/xml' \
            http://127.0.0.1:18080/api/v1/analyses \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "queued"; assert len(data["source_files"]) == 1; print(data["id"])')"

          for attempt in $(seq 1 90); do
            ANALYSIS_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              "http://127.0.0.1:18080/api/v1/analyses/$ANALYSIS_ID")"
            ANALYSIS_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$ANALYSIS_RESPONSE")"
            if [[ "$ANALYSIS_STATUS" == completed ]]; then
              python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["document_count"] >= 1; assert data["reports"]' <<< "$ANALYSIS_RESPONSE"
              break
            fi
            if [[ "$ANALYSIS_STATUS" == failed ]]; then
              printf 'Auditoria falhou: %s\n' "$ANALYSIS_RESPONSE" >&2
              exit 1
            fi
            if (( attempt == 90 )); then
              printf 'Timeout aguardando auditoria: %s\n' "$ANALYSIS_RESPONSE" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:18080/api/v1/analyses/$ANALYSIS_ID/logs?per_page=200" \
            | python3 -c 'import json,sys; events={item["event"] for item in json.load(sys.stdin)["data"]}; assert {"processing_started","request_started","completed"} <= events, events'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:18080/api/v1/application-logs?analysis_batch_id=$ANALYSIS_ID" \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["data"]) >= 3'

          REPROCESS_ID="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "http://127.0.0.1:18080/api/v1/analyses/$ANALYSIS_ID/reprocess" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "queued"; assert data["reprocessed_from_id"]; print(data["id"])')"

          for attempt in $(seq 1 90); do
            REPROCESS_RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              "http://127.0.0.1:18080/api/v1/analyses/$REPROCESS_ID")"
            REPROCESS_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$REPROCESS_RESPONSE")"
            if [[ "$REPROCESS_STATUS" == completed ]]; then
              python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["document_count"] >= 1; assert data["reprocessed_from"]["id"]' <<< "$REPROCESS_RESPONSE"
              break
            fi
            if [[ "$REPROCESS_STATUS" == failed ]]; then
              printf 'Reprocessamento falhou: %s\n' "$REPROCESS_RESPONSE" >&2
              exit 1
            fi
            if (( attempt == 90 )); then
              printf 'Timeout aguardando reprocessamento: %s\n' "$REPROCESS_RESPONSE" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Verify image runtime contracts
        run: |
          docker run --rm --entrypoint php auditor-fiscal/api:pr -m | grep -Fx sockets
          docker run --rm --entrypoint php auditor-fiscal/api:pr -m | grep -Fx amqp
          docker run --rm --entrypoint php auditor-fiscal/api:pr -m | grep -Fx redis
          docker run --rm --entrypoint python auditor-fiscal/fiscal-engine:pr -c 'import app.main'
          docker image inspect auditor-fiscal/api:pr auditor-fiscal/web:pr auditor-fiscal/fiscal-engine:pr >/dev/null

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: auditor-fiscal/api:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: auditor-fiscal/web:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Fiscal Engine image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: auditor-fiscal/fiscal-engine:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true


      - name: Publish release-candidate validation summary
        if: success()
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          {
            echo "## Candidato v${VERSION_VALUE} validado em linux/amd64"
            echo
            echo "- API, Web e Fiscal Engine construídos integralmente"
            echo "- PostgreSQL, Redis, RabbitMQ e MinIO inicializados"
            echo "- migrations e seeds executados"
            echo "- autenticação e catálogo validados"
            echo "- imagens analisadas pelo Trivy"
            echo "- publicação: somente após merge em main"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop integration stack
        if: always()
        run: docker compose down --remove-orphans
