name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      namespace: ${{ steps.version.outputs.namespace }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate source privacy
        run: python3 scripts/scan-repository-data.py

      - name: Validate version and tag
        run: bash ./scripts/check-version.sh --release

      - name: Export version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_VALUE"
          NAMESPACE="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          {
            echo "## Release v$VERSION_VALUE"
            echo
            echo "- Namespace GHCR: \`$NAMESPACE\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  api-quality:
    name: Release gate / API
    needs: contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, bcmath, curl, dom, intl, mbstring, pcntl, pdo_sqlite, pdo_pgsql, redis, sockets, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate and test
        run: |
          composer validate --strict
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php artisan test

  engine-quality:
    name: Release gate / Fiscal engine
    needs: contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fiscal-engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/fiscal-engine/pyproject.toml
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Validate and test
        run: |
          python -m compileall -q app tests
          ruff check app tests
          pytest --cov=app --cov-report=term-missing
      - name: Validate synthetic dataset
        working-directory: .
        run: python3 scripts/validate-demo-dataset.py

  web-quality:
    name: Release gate / Web
    needs: contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate and build
        run: |
          npm run validate:sfc
          npm run typecheck
          npm run test:unit
          npm run build

  infrastructure-quality:
    name: Release gate / Repository and Compose
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate scripts and repository data
        run: |
          shellcheck scripts/*.sh scripts/lib/*.sh
          python3 scripts/scan-repository-data.py
      - name: Prepare validation environment
        run: |
          cp .env.example .env
          sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=release-gate|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=release-gate|' .env
          sed -i 's|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=release-gate|' .env
          sed -i 's|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=release-gate|' .env
          sed -i 's|^FISCAL_ENGINE_TOKEN=.*|FISCAL_ENGINE_TOKEN=release-gate|' .env
          sed -i 's|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=release-gate|' .env
          sed -i 's|^GRAFANA_ADMIN_PASSWORD=.*|GRAFANA_ADMIN_PASSWORD=release-gate|' .env
          sed -i 's|^GHCR_NAMESPACE=.*|GHCR_NAMESPACE=${{ needs.contract.outputs.namespace }}|' .env
      - name: Validate Compose contracts
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.yaml -f deploy/ci/compose.ci.yaml config --quiet

  publish:
    name: Build and publish ${{ matrix.component }}
    needs: [contract, api-quality, engine-quality, web-quality, infrastructure-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: auditorfiscal-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            image: auditorfiscal-web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - component: fiscal-engine
            image: auditorfiscal-fiscal-engine
            context: ./services/fiscal-engine
            dockerfile: ./services/fiscal-engine/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.contract.outputs.namespace }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.contract.outputs.version }}
            type=raw,value=${{ needs.contract.outputs.major_minor }}
            type=raw,value=${{ needs.contract.outputs.major }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Auditor Fiscal ${{ matrix.component }}
            org.opencontainers.image.description=Componente ${{ matrix.component }} da plataforma Auditor Fiscal
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.version=${{ needs.contract.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish AMD64 image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.contract.outputs.namespace }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify published release images
    needs: [contract, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: compose.yaml:compose.production.yaml:deploy/ci/compose.ci.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release verification environment
        shell: bash
        run: |
          cat > .env <<ENV
          APP_NAME="Auditor Fiscal Release Verification"
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:18081
          APP_TIMEZONE=UTC
          FRONTEND_URL=http://127.0.0.1:18081
          ADMIN_EMAIL=admin@example.invalid
          ADMIN_PASSWORD=release-ci-password
          DEPLOY_MODE=ghcr
          GHCR_REGISTRY=${REGISTRY}
          GHCR_NAMESPACE=${{ needs.contract.outputs.namespace }}
          AUDITOR_IMAGE_TAG=${{ needs.contract.outputs.version }}
          COMPOSE_PROFILES=
          APP_HTTP_BIND=127.0.0.1
          APP_HTTP_PORT=18081
          AUDITOR_DOMAIN=auditor.example.invalid
          CADDY_EMAIL=admin@example.invalid
          DB_CONNECTION=pgsql
          DB_HOST=postgres
          DB_PORT=5432
          DB_DATABASE=auditor_fiscal
          DB_USERNAME=auditor
          DB_PASSWORD=release-ci-password
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=rabbitmq
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          RABBITMQ_USER=auditor
          RABBITMQ_PASSWORD=release-ci-password
          RABBITMQ_VHOST=/
          FILESYSTEM_DISK=s3
          AWS_ACCESS_KEY_ID=auditor
          AWS_SECRET_ACCESS_KEY=release-ci-password
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=auditor-fiscal-release-ci
          AWS_ENDPOINT=http://minio:9000
          AWS_USE_PATH_STYLE_ENDPOINT=true
          FISCAL_ENGINE_URL=http://fiscal-engine:8000
          FISCAL_ENGINE_TOKEN=release-ci-token
          MAX_UPLOAD_MB=50
          ZIP_MAX_FILES=1000
          ZIP_MAX_UNCOMPRESSED_MB=256
          MINIO_ROOT_USER=auditor
          MINIO_ROOT_PASSWORD=release-ci-password
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=release-ci-password
          ENV

      - name: Pull published images
        run: docker compose pull api web fiscal-engine

      - name: Start infrastructure
        run: docker compose up -d --wait --wait-timeout 180 postgres redis rabbitmq minio

      - name: Initialize object storage
        run: docker compose run --rm --no-deps minio-init

      - name: Apply migrations and seeds from published API image
        run: docker compose run --rm --no-deps api php artisan migrate:fresh --seed --force

      - name: Start published application images
        run: docker compose up -d --no-build api web fiscal-engine

      - name: Verify release health and authentication
        shell: bash
        run: |
          set -euo pipefail
          wait_url() {
            local name="$1" url="$2"
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$name disponível em $url"
                return 0
              fi
              sleep 2
            done
            echo "Timeout aguardando $name" >&2
            return 1
          }
          wait_url API http://127.0.0.1:18080/api/v1/health/ready
          wait_url Web http://127.0.0.1:18081/health
          wait_url Fiscal-engine http://127.0.0.1:18082/health/live
          TOKEN="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.invalid","password":"release-ci-password","device_name":"release"}' \
            http://127.0.0.1:18080/api/v1/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          test -n "$TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:18080/api/v1/catalogs \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["data"]) >= 1'

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop release verification stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release:
    name: Create GitHub Release
    needs: [contract, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate source and deployment bundles
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="${{ needs.contract.outputs.version }}"
          PREFIX="auditor-fiscal-v${VERSION_VALUE}"
          mkdir -p dist

          git archive --format=zip --prefix="${PREFIX}/" \
            --output="dist/${PREFIX}-source.zip" HEAD
          git archive --format=tar.gz --prefix="${PREFIX}/" \
            --output="dist/${PREFIX}-source.tar.gz" HEAD

          tar -czf "dist/${PREFIX}-deploy.tar.gz" \
            compose.yaml compose.production.yaml .env.example \
            deploy scripts docs README.md PRIVACY.md SECURITY.md LICENSE VERSION

          cat > "dist/${PREFIX}-images.txt" <<IMAGES
          ${{ env.REGISTRY }}/${{ needs.contract.outputs.namespace }}/auditorfiscal-api:${VERSION_VALUE}
          ${{ env.REGISTRY }}/${{ needs.contract.outputs.namespace }}/auditorfiscal-web:${VERSION_VALUE}
          ${{ env.REGISTRY }}/${{ needs.contract.outputs.namespace }}/auditorfiscal-fiscal-engine:${VERSION_VALUE}
          IMAGES

          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.contract.outputs.tag }}"
          TITLE="Auditor Fiscal $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi
