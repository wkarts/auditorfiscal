name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Reserve next available version
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONING_TOKEN: ${{ secrets.VERSIONING_TOKEN }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          bash ./scripts/auto-version.sh
          if git diff --quiet; then
            exit 0
          fi
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          git config user.name 'Wallace Kleiton'
          git config user.email 'wkarts@gmail.com'
          git add \
            VERSION CHANGELOG.md \
            apps/web/package.json services/fiscal-engine/pyproject.toml \
            services/fiscal-engine/app/main.py
          git commit -m "chore(release): reserva v${VERSION_VALUE}"
          PUSH_TOKEN="${VERSIONING_TOKEN:-$GH_TOKEN}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${PR_HEAD_REF}"
          if [[ -z "$VERSIONING_TOKEN" ]]; then
            # Pushes do GITHUB_TOKEN não geram eventos recursivos. O dispatch
            # explícito valida o novo SHA sem exigir um secret adicional.
            gh workflow run ci.yml --ref "${PR_HEAD_REF}"
          fi

      - name: Validate repository privacy
        run: python3 scripts/scan-repository-data.py

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Validate release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          set -euo pipefail
          bash ./scripts/check-version.sh --ci

          # Regressão: tags de deploy podem ser fixadas para rollback sem que o
          # contrato exija igualdade com VERSION.
          cp .env.example /tmp/env.example.original
          trap 'cp /tmp/env.example.original .env.example' EXIT
          sed -i \
            -e 's/^AUDITOR_IMAGE_TAG=.*/AUDITOR_IMAGE_TAG=9.9.9/' \
            -e 's/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=9.9.9/' \
            .env.example
          bash ./scripts/check-version.sh --ci

  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, bcmath, curl, dom, intl, mbstring, pcntl, pdo_sqlite, pdo_pgsql, redis, sockets, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run API tests
        run: php artisan test

  engine:
    name: Fiscal engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fiscal-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/fiscal-engine/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Validate Python bytecode
        run: python -m compileall -q app tests

      - name: Run static analysis
        run: ruff check app tests

      - name: Run fiscal-engine tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Validate synthetic dataset
        working-directory: .
        run: python3 scripts/validate-demo-dataset.py

  web:
    name: Web (Vue/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate Vue SFC structure
        run: npm run validate:sfc

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare non-secret validation environment
        run: |
          VALIDATION_SECRET="$(openssl rand -hex 24)"
          cp .env.example .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${VALIDATION_SECRET}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${VALIDATION_SECRET}|" .env
          sed -i "s|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=${VALIDATION_SECRET}|" .env
          sed -i 's|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=|' .env
          sed -i "s|^FISCAL_ENGINE_TOKEN=.*|FISCAL_ENGINE_TOKEN=${VALIDATION_SECRET}|" .env
          sed -i "s|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=${VALIDATION_SECRET}|" .env
          sed -i "s|^GRAFANA_ADMIN_PASSWORD=.*|GRAFANA_ADMIN_PASSWORD=${VALIDATION_SECRET}|" .env
          sed -i 's|^GHCR_NAMESPACE=.*|GHCR_NAMESPACE=wkarts|' .env
          cp .env deploy/dockge/.env

      - name: Validate ready-to-use Compose image defaults
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'Defina|\$\{[^}]*:\?' --glob '*compose*.yaml' --glob '*compose*.yml'; then
            echo 'Compose não pode exigir variáveis durante a construção da configuração.' >&2
            exit 1
          fi
          docker compose -f compose.yaml -f compose.production.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-api:latest'
          docker compose -f compose.yaml -f compose.production.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-web:latest'
          docker compose -f compose.yaml -f compose.production.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-fiscal-engine:latest'
          docker compose --env-file .env.example -f deploy/dockge/compose.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-api:latest'
          docker compose --env-file .env.example -f deploy/dockge/compose.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-web:latest'
          docker compose --env-file .env.example -f deploy/dockge/compose.yaml config --images \
            | grep -Fx 'ghcr.io/wkarts/auditorfiscal-fiscal-engine:latest'

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          validate_prefixed_services() {
            local invalid
            docker compose "$@" config --quiet
            invalid="$(docker compose "$@" config --services | grep -Ev '^auditor-fiscal-[a-z0-9-]+$' || true)"
            if [[ -n "$invalid" ]]; then
              printf 'Serviços sem o prefixo obrigatório auditor-fiscal-:\n%s\n' "$invalid" >&2
              return 1
            fi
          }
          validate_prefixed_services -f compose.yaml
          validate_prefixed_services -f compose.yaml -f compose.production.yaml
          validate_prefixed_services -f compose.yaml -f deploy/ci/compose.ci.yaml
          validate_prefixed_services --env-file .env.example -f deploy/dockge/compose.yaml

          validate_engine_database_contract() {
            docker compose "$@" config --format json | python3 -c '
          import json, sys
          engine = json.load(sys.stdin)["services"]["auditor-fiscal-engine"]
          environment = engine.get("environment", {})
          assert "DATABASE_URL" not in environment, "DATABASE_URL legada não pode ser injetada no engine"
          assert environment.get("DB_HOST") == "auditor-fiscal-postgres", environment.get("DB_HOST")
          assert all(key in environment for key in ("DB_PORT", "DB_DATABASE", "DB_USERNAME", "DB_PASSWORD"))
          '
          }
          validate_engine_database_contract -f compose.yaml
          validate_engine_database_contract --env-file .env.example -f deploy/dockge/compose.yaml

          root_services="$(docker compose -f compose.yaml --profile monitoring config --services | sort)"
          dockge_services="$(docker compose --env-file .env.example -f deploy/dockge/compose.yaml --profile monitoring config --services | sort)"
          if [[ "$root_services" != "$dockge_services" ]]; then
            echo 'Os contratos raiz e Dockge devem oferecer os mesmos serviços.' >&2
            diff -u <(printf '%s\n' "$root_services") <(printf '%s\n' "$dockge_services") || true
            exit 1
          fi

          validate_public_ports() {
            docker compose "$@" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          exposed = {name: service.get("ports", []) for name, service in services.items() if service.get("ports")}
          assert set(exposed) == {"auditor-fiscal-web"}, f"portas internas publicadas: {sorted(exposed)}"
          port = exposed["auditor-fiscal-web"][0]
          assert port["host_ip"] == "127.0.0.1", port
          assert int(port["published"]) == 8080, port
          assert int(port["target"]) == 80, port
          '
          }
          validate_public_ports -f compose.yaml
          validate_public_ports -f compose.yaml -f compose.production.yaml
          validate_public_ports --env-file .env.example -f deploy/dockge/compose.yaml

      - name: Validate isolation between two Dockge stacks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dockge-instance-01 /tmp/dockge-instance-02
          mkdir -p /tmp/dockge-instance-01 /tmp/dockge-instance-02
          cp deploy/dockge/compose.yaml /tmp/dockge-instance-01/compose.yaml
          cp deploy/dockge/compose.yaml /tmp/dockge-instance-02/compose.yaml
          cp .env /tmp/dockge-instance-01/.env
          sed \
            -e 's/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=auditor-fiscal-wwsoftwares-homolog/' \
            -e 's/^INSTANCE_NAME=.*/INSTANCE_NAME=wwsoftwares-homolog/' \
            -e 's/^RESOURCE_PREFIX=.*/RESOURCE_PREFIX=auditor-fiscal-wwsoftwares-homolog/' \
            -e 's/WEB_PUBLISHED_PORT=8080/WEB_PUBLISHED_PORT=8082/' \
            .env > /tmp/dockge-instance-02/.env
          docker compose --env-file /tmp/dockge-instance-01/.env -f /tmp/dockge-instance-01/compose.yaml config > /tmp/instance-01.yaml
          docker compose --env-file /tmp/dockge-instance-02/.env -f /tmp/dockge-instance-02/compose.yaml config > /tmp/instance-02.yaml
          grep -F 'name: auditor-fiscal-wwsoftwares' /tmp/instance-01.yaml
          grep -F 'name: auditor-fiscal-wwsoftwares-homolog' /tmp/instance-02.yaml
          grep -F 'source: /tmp/dockge-instance-01/postgres_data' /tmp/instance-01.yaml
          grep -F 'source: /tmp/dockge-instance-02/postgres_data' /tmp/instance-02.yaml
          grep -F 'source: /tmp/dockge-instance-01/api_storage' /tmp/instance-01.yaml
          grep -F 'source: /tmp/dockge-instance-02/api_storage' /tmp/instance-02.yaml
          grep -F 'published: "8080"' /tmp/instance-01.yaml
          grep -F 'published: "8082"' /tmp/instance-02.yaml
          ! grep -F 'container_name:' /tmp/instance-01.yaml
