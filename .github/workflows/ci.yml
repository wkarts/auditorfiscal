name: CI
on:
  pull_request:
  push: {branches: [main, develop]}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: mbstring, pdo_sqlite, bcmath, pcntl, intl, zip, coverage: none}
      - run: composer install --no-interaction --prefer-dist
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer validate --strict
      - run: php artisan test
  engine:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/fiscal-engine}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app tests
      - run: pytest --cov=app --cov-report=term-missing
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:unit
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
