name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Reserve next available version
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONING_TOKEN: ${{ secrets.VERSIONING_TOKEN }}
        run: |
          set -euo pipefail
          bash ./scripts/auto-version.sh
          if git diff --quiet; then
            exit 0
          fi
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          git config user.name 'Wallace Kleiton'
          git config user.email 'wkarts@gmail.com'
          git add \
            VERSION CHANGELOG.md .env.example deploy/dockge/compose.yaml \
            apps/web/package.json services/fiscal-engine/pyproject.toml \
            services/fiscal-engine/app/main.py
          git commit -m "chore(release): reserva v${VERSION_VALUE}"
          PUSH_TOKEN="${VERSIONING_TOKEN:-$GH_TOKEN}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${{ github.head_ref }}"
          if [[ -z "$VERSIONING_TOKEN" ]]; then
            # Pushes do GITHUB_TOKEN não geram eventos recursivos. O dispatch
            # explícito valida o novo SHA sem exigir um secret adicional.
            gh workflow run ci.yml --ref "${{ github.head_ref }}"
          fi

      - name: Validate repository privacy
        run: python3 scripts/scan-repository-data.py

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Validate release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: bash ./scripts/check-version.sh

  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, bcmath, curl, dom, intl, mbstring, pcntl, pdo_sqlite, pdo_pgsql, redis, sockets, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run API tests
        run: php artisan test

  engine:
    name: Fiscal engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fiscal-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/fiscal-engine/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Validate Python bytecode
        run: python -m compileall -q app tests

      - name: Run static analysis
        run: ruff check app tests

      - name: Run fiscal-engine tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Validate synthetic dataset
        working-directory: .
        run: python3 scripts/validate-demo-dataset.py

  web:
    name: Web (Vue/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate Vue SFC structure
        run: npm run validate:sfc

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare non-secret validation environment
        run: |
          cp .env.example .env
          sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-only|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-only|' .env
          sed -i 's|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=ci-only|' .env
          sed -i 's|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=ci-only|' .env
          sed -i 's|^FISCAL_ENGINE_TOKEN=.*|FISCAL_ENGINE_TOKEN=ci-only|' .env
          sed -i 's|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=ci-only|' .env
          sed -i 's|^GRAFANA_ADMIN_PASSWORD=.*|GRAFANA_ADMIN_PASSWORD=ci-only|' .env
          sed -i 's|^GHCR_NAMESPACE=.*|GHCR_NAMESPACE=example|' .env
          cp .env deploy/dockge/.env

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          validate_prefixed_services() {
            local invalid
            docker compose "$@" config --quiet
            invalid="$(docker compose "$@" config --services | grep -Ev '^auditor-fiscal-[a-z0-9-]+$' || true)"
            if [[ -n "$invalid" ]]; then
              printf 'Serviços sem o prefixo obrigatório auditor-fiscal-:\n%s\n' "$invalid" >&2
              return 1
            fi
          }
          validate_prefixed_services -f compose.yaml
          validate_prefixed_services -f compose.yaml -f compose.production.yaml
          validate_prefixed_services -f compose.yaml -f deploy/ci/compose.ci.yaml
          validate_prefixed_services --env-file .env.example -f deploy/dockge/compose.yaml

      - name: Validate isolation between two Dockge stacks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dockge-instance-01 /tmp/dockge-instance-02
          mkdir -p /tmp/dockge-instance-01 /tmp/dockge-instance-02
          cp deploy/dockge/compose.yaml /tmp/dockge-instance-01/compose.yaml
          cp deploy/dockge/compose.yaml /tmp/dockge-instance-02/compose.yaml
          cp .env /tmp/dockge-instance-01/.env
          sed \
            -e 's/auditor-fiscal-cliente01/auditor-fiscal-cliente02/g' \
            -e 's/cliente01/cliente02/g' \
            -e 's/APP_HTTP_PORT=8080/APP_HTTP_PORT=8082/' \
            .env > /tmp/dockge-instance-02/.env
          docker compose --env-file /tmp/dockge-instance-01/.env -f /tmp/dockge-instance-01/compose.yaml config > /tmp/instance-01.yaml
          docker compose --env-file /tmp/dockge-instance-02/.env -f /tmp/dockge-instance-02/compose.yaml config > /tmp/instance-02.yaml
          grep -F 'name: auditor-fiscal-cliente01' /tmp/instance-01.yaml
          grep -F 'name: auditor-fiscal-cliente02' /tmp/instance-02.yaml
          grep -F 'source: /tmp/dockge-instance-01/postgres_data' /tmp/instance-01.yaml
          grep -F 'source: /tmp/dockge-instance-02/postgres_data' /tmp/instance-02.yaml
          grep -F 'source: /tmp/dockge-instance-01/api_storage' /tmp/instance-01.yaml
          grep -F 'source: /tmp/dockge-instance-02/api_storage' /tmp/instance-02.yaml
          grep -F 'published: "8080"' /tmp/instance-01.yaml
          grep -F 'published: "8082"' /tmp/instance-02.yaml
          ! grep -F 'container_name:' /tmp/instance-01.yaml
