name: Container Images

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'services/fiscal-engine/**'
      - '.github/workflows/docker-release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Evita consumir a cota de artefatos com arquivos .dockerbuild. O resumo
  # visual continua disponível no job; somente o upload do registro é omitido.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  validate:
    name: Validate ${{ matrix.component }} Dockerfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - component: fiscal-engine
            context: ./services/fiscal-engine
            dockerfile: ./services/fiscal-engine/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate image build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.dockerfile }}"

          case "${{ matrix.component }}" in
            api)
              test -f apps/api/composer.json
              grep -Fq '"ext-sockets": "*"' apps/api/composer.json
              grep -Eq '^[[:space:]]*sockets[[:space:]]*\\$' apps/api/Dockerfile
              grep -Fq 'php -m | grep -Fxq sockets' apps/api/Dockerfile
              ;;
            web)
              test -f apps/web/package.json
              test -f apps/web/nginx.conf
              ;;
            fiscal-engine)
              test -f services/fiscal-engine/pyproject.toml
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Dockerfile without building image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          call: check

  publish:
    name: Build and publish ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: auditorfiscal-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            image: auditorfiscal-web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - component: fiscal-engine
            image: auditorfiscal-fiscal-engine
            context: ./services/fiscal-engine
            dockerfile: ./services/fiscal-engine/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate image build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.dockerfile }}"
          if [[ "${{ matrix.component }}" == "api" ]]; then
            test -f apps/api/composer.json
            grep -Fq '"ext-sockets": "*"' apps/api/composer.json
            grep -Eq '^[[:space:]]*sockets[[:space:]]*\\$' apps/api/Dockerfile
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish deployment bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Package deployment artifacts
        run: >-
          tar -czf auditor-fiscal-deploy.tar.gz
          compose.yaml compose.production.yaml .env.example
          deploy scripts docs README.md VERSION

      - name: Generate checksum
        run: sha256sum auditor-fiscal-deploy.tar.gz > auditor-fiscal-deploy.tar.gz.sha256

      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            auditor-fiscal-deploy.tar.gz
            auditor-fiscal-deploy.tar.gz.sha256
