name: Docker Release
on: {push: {tags: ['v*.*.*']}}
permissions: {contents: write, packages: write, id-token: write}
jobs:
  images:
    runs-on: ubuntu-latest
    strategy: {matrix: {component: [api, web, fiscal-engine]}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/metadata-action@v5
        id: meta
        with: {images: "ghcr.io/${{ github.repository }}-${{ matrix.component }}", tags: "type=semver,pattern={{version}}\ntype=semver,pattern={{major}}.{{minor}}"}
      - uses: docker/build-push-action@v6
        with: {context: "${{ matrix.component == 'fiscal-engine' && './services/fiscal-engine' || format('./apps/{0}', matrix.component) }}", push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}", platforms: linux/amd64,linux/arm64, provenance: true, sbom: true}
  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package deployment artifacts
        run: tar -czf auditor-fiscal-deploy.tar.gz compose.yaml compose.production.yaml .env.example deploy scripts docs README.md VERSION
      - run: sha256sum auditor-fiscal-deploy.tar.gz > auditor-fiscal-deploy.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with: {generate_release_notes: true, files: "auditor-fiscal-deploy.tar.gz\nauditor-fiscal-deploy.tar.gz.sha256"}
