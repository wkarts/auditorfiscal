name: Security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan dependencies, files and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secrets:
    name: Gitleaks repository scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan current working tree
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "${GITLEAKS_IMAGE}" dir /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

      - name: Scan commits introduced by pull request
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "${GITLEAKS_IMAGE}" git /repo \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

      - name: Scan complete repository history
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose
