# Override de produção com imagens publicadas no GitHub Container Registry.
# Uso: DEPLOY_MODE=ghcr ./scripts/install.sh
# As imagens oficiais funcionam sem configuração adicional. Para usar um fork
# ou outro registry, sobrescreva GHCR_REGISTRY, GHCR_NAMESPACE e AUDITOR_IMAGE_TAG
# no arquivo .env; essas opções não bloqueiam a validação do Compose.
# As chaves abaixo repetem exatamente os nomes prefixados de `compose.yaml`;
# isso evita criar serviços paralelos quando o override é combinado à base.
services:
  auditor-fiscal-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: &default_logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {memory: 512M}

  auditor-fiscal-scheduler:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging

  auditor-fiscal-worker:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {memory: 512M}

  auditor-fiscal-web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-web:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging

  auditor-fiscal-engine:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-fiscal-engine:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}
        reservations: {memory: 1G}

  auditor-fiscal-postgres:
    logging: *default_logging
    shm_size: 512mb
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3G}

  auditor-fiscal-redis:
    logging: *default_logging

  auditor-fiscal-rabbitmq:
    logging: *default_logging

  auditor-fiscal-minio:
    logging: *default_logging

  auditor-fiscal-caddy:
    logging: *default_logging
