# Override de produção com imagens publicadas no GitHub Container Registry.
# Uso: docker compose -f compose.yaml -f compose.production.yaml up -d --pull always --no-build
services:
  api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    deploy:
      resources:
        limits: {cpus: '2.0', memory: 2G}
        reservations: {memory: 512M}
    logging: &default_logging
      driver: json-file
      options: {max-size: 20m, max-file: '5'}

  scheduler:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging

  worker:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-api:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    deploy:
      resources:
        limits: {cpus: '2.0', memory: 2G}
        reservations: {memory: 512M}
    logging: *default_logging

  web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-web:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default_logging

  fiscal-engine:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_NAMESPACE:-wkarts}/auditorfiscal-fiscal-engine:${AUDITOR_IMAGE_TAG:-latest}
    pull_policy: always
    deploy:
      resources:
        limits: {cpus: '4.0', memory: 4G}
        reservations: {memory: 1G}
    logging: *default_logging

  postgres:
    deploy:
      resources:
        limits: {cpus: '2.0', memory: 3G}
    shm_size: 512mb
    logging: *default_logging

  redis:
    logging: *default_logging

  rabbitmq:
    logging: *default_logging

  minio:
    logging: *default_logging

  caddy:
    logging: *default_logging
