# Override de produção. Use sempre com: docker compose -f compose.yaml -f compose.production.yaml ...
services:
  api: {deploy: {resources: {limits: {cpus: '2.0', memory: 2G}, reservations: {memory: 512M}}}, logging: {driver: json-file, options: {max-size: 20m, max-file: '5'}}}
  worker: {deploy: {resources: {limits: {cpus: '2.0', memory: 2G}, reservations: {memory: 512M}}}, logging: {driver: json-file, options: {max-size: 20m, max-file: '5'}}}
  fiscal-engine: {deploy: {resources: {limits: {cpus: '4.0', memory: 4G}, reservations: {memory: 1G}}}, logging: {driver: json-file, options: {max-size: 20m, max-file: '5'}}}
  postgres: {deploy: {resources: {limits: {cpus: '2.0', memory: 3G}}}, shm_size: 512mb}
