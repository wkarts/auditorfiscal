name: "${COMPOSE_PROJECT_NAME:-auditor-fiscal}"

# Contrato de nomenclatura: toda chave de serviço e toda referência DNS interna
# deve iniciar com `auditor-fiscal-`. O CI valida este contrato via `config --services`.
x-api-build: &api_build
  context: ./apps/api
  dockerfile: Dockerfile
  args:
    BASE_IMAGE: ${API_BASE_IMAGE:-ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v1}
x-api-image: &api_image ${LOCAL_API_IMAGE:-auditor-fiscal/api:dev}

services:
  auditor-fiscal-storage-init:
    image: ${STORAGE_INIT_IMAGE:-alpine:3.22}
    restart: "no"
    volumes:
      - ./api_storage:/api_storage
    command: ["/bin/sh", "-ec", "chown -R ${API_RUNTIME_UID:-82}:${API_RUNTIME_GID:-82} /api_storage && chmod 0770 /api_storage"]

  # Inicializa banco, usuário administrativo e filas antes de liberar a API.
  # migrate/seed/queue_declare são idempotentes e este serviço possui uma única
  # instância por projeto Compose, evitando concorrência no primeiro deploy.
  auditor-fiscal-app-init:
    image: *api_image
    build: *api_build
    restart: "no"
    env_file: .env
    volumes:
      - ./api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-storage-init:
        condition: service_completed_successfully
      auditor-fiscal-postgres:
        condition: service_healthy
      auditor-fiscal-redis:
        condition: service_healthy
      auditor-fiscal-rabbitmq:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        php artisan migrate --force
        php artisan db:seed --force
        php artisan rabbitmq:declare-queues

  auditor-fiscal-caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: [edge-caddy]
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
      auditor-fiscal-web:
        condition: service_healthy

  auditor-fiscal-api:
    image: *api_image
    build: *api_build
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-app-init:
        condition: service_completed_successfully
      auditor-fiscal-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  auditor-fiscal-scheduler:
    image: *api_image
    build: *api_build
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy

  auditor-fiscal-worker:
    image: *api_image
    build: *api_build
    restart: unless-stopped
    env_file: .env
    command:
      - php
      - artisan
      - queue:work
      - rabbitmq
      - --queue=high,default,reports
      - --sleep=1
      - --tries=3
      - --timeout=3600
      - --max-time=3600
    volumes:
      - ./api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
      auditor-fiscal-engine:
        condition: service_healthy

  auditor-fiscal-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  auditor-fiscal-engine:
    build:
      context: ./services/fiscal-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@auditor-fiscal-postgres:5432/${DB_DATABASE}
    depends_on:
      auditor-fiscal-postgres:
        condition: service_healthy
      auditor-fiscal-minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  auditor-fiscal-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  auditor-fiscal-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    env_file: .env
    depends_on:
      auditor-fiscal-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://auditor-fiscal-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${AWS_BUCKET}"
        mc anonymous set none "local/$${AWS_BUCKET}"

  auditor-fiscal-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    profiles: [monitoring]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus

  auditor-fiscal-grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
