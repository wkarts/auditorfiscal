name: "${COMPOSE_PROJECT_NAME:-auditor-fiscal}"

# Contrato de nomenclatura: toda chave de serviço e toda referência DNS interna
# deve iniciar com `auditor-fiscal-`. O CI valida este contrato via `config --services`.
services:
  auditor-fiscal-caddy:
    image: caddy:2-alpine
    profiles: [edge-caddy]
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
      auditor-fiscal-web:
        condition: service_healthy

  auditor-fiscal-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v1}
    restart: unless-stopped
    env_file: .env
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-postgres:
        condition: service_healthy
      auditor-fiscal-redis:
        condition: service_healthy
      auditor-fiscal-rabbitmq:
        condition: service_healthy
      auditor-fiscal-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  auditor-fiscal-scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v1}
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy

  auditor-fiscal-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-ghcr.io/wkarts/auditorfiscal-api-base:php8.4-v1}
    restart: unless-stopped
    env_file: .env
    command:
      - php
      - artisan
      - queue:work
      - rabbitmq
      - --queue=high,default,reports
      - --sleep=1
      - --tries=3
      - --timeout=3600
      - --max-time=3600
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
      auditor-fiscal-fiscal-engine:
        condition: service_healthy

  auditor-fiscal-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      auditor-fiscal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  auditor-fiscal-fiscal-engine:
    build:
      context: ./services/fiscal-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@auditor-fiscal-postgres:5432/${DB_DATABASE}
    depends_on:
      auditor-fiscal-postgres:
        condition: service_healthy
      auditor-fiscal-minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  auditor-fiscal-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  auditor-fiscal-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  auditor-fiscal-minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file: .env
    depends_on:
      auditor-fiscal-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://auditor-fiscal-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${AWS_BUCKET}"
        mc anonymous set none "local/$${AWS_BUCKET}"

  auditor-fiscal-prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  auditor-fiscal-grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}
  minio_data: {}
  api_storage: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}
