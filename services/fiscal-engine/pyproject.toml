[project]
name = "auditor-fiscal-engine"
version = "1.2.0"
description = "Motor fiscal determinístico de IBS/CBS"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3",
  "lxml>=6,<7", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2",
  "reportlab>=4.4,<5", "xlsxwriter>=3.2,<4", "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.22,<1"
]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","pytest-cov>=6,<7","ruff>=0.12,<1","mypy>=1.17,<2","httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=120
target-version="py313"
[tool.ruff.lint]
# Gate bloqueante: erros semânticos e de sintaxe. Formatação fica em PR próprio.
select=["E9","F63","F7","F82"]
